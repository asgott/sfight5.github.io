<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dr. Eryk Veranis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sheet">
    <img id="bg" src="background.png" alt="character sheet" />

    <!-- HP -->
    <div class="stat-display" id="hp-display">22</div>
    <button class="stat-btn" id="hp-plus5"  onclick="changeStat('hp', 5)">+5</button>
    <button class="stat-btn" id="hp-plus1"  onclick="changeStat('hp', 1)">+1</button>
    <button class="stat-btn" id="hp-minus1" onclick="changeStat('hp', -1)">-1</button>
    <button class="stat-btn" id="hp-minus5" onclick="changeStat('hp', -5)">-5</button>

    <!-- TEMP -->
    <div class="stat-display" id="temp-display">0</div>
    <button class="stat-btn" id="temp-plus1"  onclick="changeStat('temp', 1)">+1</button>
    <button class="stat-btn" id="temp-minus1" onclick="changeStat('temp', -1)">-1</button>
    <button class="stat-btn" id="temp-plus5"  onclick="changeStat('temp', 5)">+5</button>
    <button class="stat-btn" id="temp-minus5" onclick="changeStat('temp', -5)">-5</button>

    <!-- AC -->
    <div class="stat-display" id="ac-display">13</div>
    <button class="effect-btn" id="ac-infused"  onclick="toggleEffect('infused')">INFUSED</button>
    <button class="effect-btn" id="ac-armshield" onclick="toggleEffect('armshield')">SHIELD</button>
    <button class="effect-btn" id="ac-barrier"  onclick="toggleEffect('barrier')">TACT.BARRIER</button>

    <!-- TECH -->
    <div class="stat-display" id="tech-display">11</div>
    <button class="stat-btn" id="tech-plus1"  onclick="changeStat('tech', 1)">+1</button>
    <button class="stat-btn" id="tech-minus1" onclick="changeStat('tech', -1)">-1</button>

    <!-- INJECTION NEEDLE -->
    <div class="stat-display" id="needle-atk">+4</div>
    <div class="stat-display" id="needle-dmg">2</div>
    <button class="effect-btn infuse-toggle" id="needle-infused" onclick="toggleInfuse('needle')">INFUSED</button>

    <!-- HOLDOUT -->
    <div class="stat-display" id="holdout-atk">+4</div>
    <div class="stat-display" id="holdout-dmg">2</div>
    <button class="effect-btn infuse-toggle" id="holdout-infused" onclick="toggleInfuse('holdout')">INFUSED</button>

    <!-- HOLDOUT AMMO (8 boxes) -->
    <div class="ammo-row" id="holdout-ammo">
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
    </div>

    <!-- BLASTER -->
    <div class="stat-display" id="blaster-atk">+5</div>
    <div class="stat-display" id="blaster-dmg">2</div>
    <button class="effect-btn infuse-toggle" id="blaster-infused" onclick="toggleInfuse('blaster')">INFUSED</button>

    <!-- BLASTER AMMO (14 boxes) -->
    <div class="ammo-row" id="blaster-ammo">
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
      <div class="ammo-box" onclick="toggleAmmo(this)"></div>
    </div>

    <!-- BOTTOM COUNTERS -->
    <div class="counter-box" id="counter-arkanian" onclick="spendCounter('arkanian')">
      <span class="counter-val" id="arkanian-val">1/1</span>
    </div>


    <div class="counter-box" id="counter-potent" onclick="spendShared()">
      <span class="counter-val" id="potent-val">2/2</span>
    </div>


    <div class="counter-box" id="counter-biochem" onclick="spendShared()">
      <span class="counter-val" id="biochem-val">2/2</span>
    </div>
    

  </div>
  <script src="script.js"></script>
</body>
</html>
